<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --deep:#0a3d47;
    --aqua:#7fd4d8;
    --pale:#d8f2f2;
    --lime:#8dc63f;
    --ink:#062a33;
  }
  html,body{height:100%}
  body{
    background:
      radial-gradient(ellipse 90% 70% at 50% 0%, #bfeaea 0%, #7fcdd2 45%, #2b8d99 100%);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    overflow:hidden;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}

  .hud{
    position:fixed;left:0;right:0;bottom:0;
    padding:0 24px calc(22px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;
    pointer-events:none;
  }
  .hint{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    font-weight:700;color:#0a3d47;opacity:.62;
    background:rgba(255,255,255,.42);
    border:1px solid rgba(255,255,255,.6);
    padding:9px 16px;border-radius:999px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity .45s ease;
    text-align:center;
  }
  .hint.dim{opacity:.28}

  .mark{
    position:fixed;top:calc(20px + env(safe-area-inset-top));left:24px;
    font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    font-weight:800;color:#0a3d47;opacity:.5;pointer-events:none;
  }

  .loader{
    position:fixed;inset:0;display:grid;place-items:center;
    background:#8fd5da;z-index:9;transition:opacity .6s ease;
  }
  .loader.gone{opacity:0;pointer-events:none}
  .loader span{
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    font-weight:800;color:#0a3d47;opacity:.7;
  }
  @media (max-width:520px){
    .mark{left:16px}
    .hint{font-size:10px;padding:8px 13px;letter-spacing:.12em}
  }
</style>

const stage = document.getElementById('stage');
const hint  = document.getElementById('hint');
const loader= document.getElementById('loader');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.15, 13.2);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);
const el = renderer.domElement;

/* ---------- lighting: flat and even, no specular hotspots ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.92));

const key = new THREE.DirectionalLight(0xffffff, 0.26);
key.position.set(-3, 4, 7);
scene.add(key);

const fill = new THREE.DirectionalLight(0xdff4f5, 0.20);
fill.position.set(5, 0, 5);
scene.add(fill);

// very soft wrap light so the cylinder edges don't go flat-black
const edge = new THREE.DirectionalLight(0xcdeef0, 0.16);
edge.position.set(0, 1, -6);
scene.add(edge);

/* ---------- the can ---------- */
const can = new THREE.Group();
scene.add(can);

const R = 1.16;          // body radius
const H = 4.5;           // body height (sleek 355ml proportion)
const SEG = 128;

const loadMgr = new THREE.LoadingManager(() => {
  loader.classList.add('gone');
});
const texLoader = new THREE.TextureLoader(loadMgr);

const wrapTex = texLoader.load(WRAP);
wrapTex.wrapS = THREE.RepeatWrapping;
wrapTex.wrapT = THREE.ClampToEdgeWrapping;
wrapTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
wrapTex.offset.x = 0.5;   // start facing the SPIR UP front panel

/* body */
const body = new THREE.Mesh(
  new THREE.CylinderGeometry(R, R, H, SEG, 1, true),
  new THREE.MeshPhongMaterial({
    map: wrapTex,
    shininess: 6,
    specular: 0x16343a,
    side: THREE.DoubleSide
  })
);
can.add(body);

/* aluminum used on neck, base and lid */
const alu = new THREE.MeshPhongMaterial({
  color:0xcfd8dc, shininess:14, specular:0x3a4a4f
});
const aluDark = new THREE.MeshPhongMaterial({
  color:0xaab7bc, shininess:10, specular:0x304045
});

/* ---- top: gentle rounded shoulder, matching the reference photo ----
   Reference: shoulder curves in over ~7% of can height, no visible lid or tab. */
const topY = H/2;

const shoulderH = 0.34;
const neckR = R*0.75;          // measured from the reference photo

// Lathe a smooth curve so the shoulder reads as a soft roll, not a cone.
const shoulderPts = [];
const SSTEPS = 22;
for (let i=0;i<=SSTEPS;i++){
  const t = i/SSTEPS;                    // 0 at body, 1 at top
  const rr = R + (neckR - R) * (t*t*(3-2*t));   // smoothstep
  shoulderPts.push(new THREE.Vector2(rr, t*shoulderH));
}
const shoulder = new THREE.Mesh(
  new THREE.LatheGeometry(shoulderPts, SEG),
  new THREE.MeshPhongMaterial({color:0x96d9d6, shininess:6, specular:0x16343a, side:THREE.DoubleSide})
);
shoulder.position.y = topY;
can.add(shoulder);

// thin rim, flush with the shoulder
const capMat = new THREE.MeshPhongMaterial({
  color:0x8ed2cf, shininess:8, specular:0x16343a
});
const rimRing = new THREE.Mesh(
  new THREE.TorusGeometry(neckR, 0.030, 12, SEG), capMat
);
rimRing.rotation.x = Math.PI/2;
rimRing.position.y = topY + shoulderH;
can.add(rimRing);

// flat top, seen only at a steep angle
const lid = new THREE.Mesh(
  new THREE.CircleGeometry(neckR, SEG), capMat
);
lid.rotation.x = -Math.PI/2;
lid.position.y = topY + shoulderH;
can.add(lid);

/* ---- bottom: taper + base ---- */
const botH = 0.22;
const botR = R*0.90;
const bottom = new THREE.Mesh(
  new THREE.CylinderGeometry(R, botR, botH, SEG, 1, true),
  new THREE.MeshPhongMaterial({color:0x5abebb, shininess:6, specular:0x16343a, side:THREE.DoubleSide})
);
bottom.position.y = -topY - botH/2;
can.add(bottom);

const baseRing = new THREE.Mesh(
  new THREE.TorusGeometry(botR, 0.032, 12, SEG),
  new THREE.MeshPhongMaterial({color:0x54b5b2, shininess:8, specular:0x16343a})
);
baseRing.rotation.x = Math.PI/2;
baseRing.position.y = -topY - botH;
can.add(baseRing);

const baseCap = new THREE.Mesh(
  new THREE.CircleGeometry(botR, SEG),
  new THREE.MeshPhongMaterial({color:0x4aa8a5, shininess:8, specular:0x16343a})
);
baseCap.rotation.x = Math.PI/2;
baseCap.position.y = -topY - botH - 0.02;
can.add(baseCap);

/* ---- contact shadow ---- */
(function(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128,128,4,128,128,124);
  grad.addColorStop(0,   'rgba(6,42,51,0.42)');
  grad.addColorStop(0.55,'rgba(6,42,51,0.16)');
  grad.addColorStop(1,   'rgba(6,42,51,0)');
  g.fillStyle = grad; g.fillRect(0,0,256,256);
  const sh = new THREE.Mesh(
    new THREE.PlaneGeometry(5.4, 5.4),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false})
  );
  sh.rotation.x = -Math.PI/2;
  sh.position.y = -topY - botH - 0.06;
  sh.scale.set(1, 0.55, 1);
  scene.add(sh);
})();

can.rotation.x = 0.04;

/* ---------- bubbles ---------- */
const bubbleTex = (function(){
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');

  // Crisper soda bubble: defined rim + bright specular dot.
  const grad = g.createRadialGradient(s*0.5, s*0.5, s*0.10, s*0.5, s*0.5, s*0.50);
  grad.addColorStop(0.00, 'rgba(255,255,255,0.30)');
  grad.addColorStop(0.55, 'rgba(226,250,252,0.26)');
  grad.addColorStop(0.82, 'rgba(255,255,255,0.72)');
  grad.addColorStop(0.95, 'rgba(255,255,255,1.00)');   // bright ring
  grad.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.beginPath(); g.arc(s/2, s/2, s/2, 0, Math.PI*2); g.fill();

  // highlight
  const hl = g.createRadialGradient(s*0.36, s*0.32, 0, s*0.36, s*0.32, s*0.15);
  hl.addColorStop(0, 'rgba(255,255,255,0.98)');
  hl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = hl;
  g.beginPath(); g.arc(s*0.36, s*0.32, s*0.15, 0, Math.PI*2); g.fill();

  return new THREE.CanvasTexture(c);
})();

const MAX_B = 340;
const bGeo = new THREE.BufferGeometry();
const bPos   = new Float32Array(MAX_B*3);
const bSize  = new Float32Array(MAX_B);
const bAlpha = new Float32Array(MAX_B);
bGeo.setAttribute('position', new THREE.BufferAttribute(bPos,3));
bGeo.setAttribute('size',     new THREE.BufferAttribute(bSize,1));
bGeo.setAttribute('alpha',    new THREE.BufferAttribute(bAlpha,1));

/* PointsMaterial ignores a per-point size attribute, so drive size and
   alpha per bubble with a small shader instead. */
const bMat = new THREE.ShaderMaterial({
  uniforms: {
    map:    { value: bubbleTex },
    uOpacity:{ value: 0 },
    uScale: { value: innerHeight * 0.5 }
  },
  vertexShader: `
    attribute float size;
    attribute float alpha;
    varying float vAlpha;
    uniform float uScale;
    void main(){
      vAlpha = alpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * uScale / max(-mv.z, 0.001);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D map;
    uniform float uOpacity;
    varying float vAlpha;
    void main(){
      vec4 t = texture2D(map, gl_PointCoord);
      gl_FragColor = vec4(t.rgb, t.a * vAlpha * uOpacity);
      if (gl_FragColor.a < 0.01) discard;
    }`,
  transparent: true,
  depthWrite: false
});

const bubbles = new THREE.Points(bGeo, bMat);
scene.add(bubbles);

const bData = [];
for (let i=0;i<MAX_B;i++) bData.push({alive:false, x:0,y:0,z:0, vy:0, drift:0, ph:0, r:0.1, fade:0});

function spawn(){
  for (const b of bData){
    if (b.alive) continue;
    const a = Math.random()*Math.PI*2;
    const rad = R*(0.90 + Math.random()*0.62);
    b.x = Math.cos(a)*rad;
    b.z = Math.sin(a)*rad;
    b.y = -H/2 - 0.5 + Math.random()*1.0;
    b.vy = 1.1 + Math.random()*1.9;
    b.drift = (Math.random()-0.5)*0.9;
    b.ph = Math.random()*Math.PI*2;
    // wider size range, clearly larger than before
    b.r = 0.085 + Math.random()*0.20;
    b.fade = 0;
    b.alive = true;
    return;
  }
}

/* ---------- interaction ---------- */
let autoSpin = true;
let hovering = false;
let spinVel = 0.0038;      // idle spin speed
let dragging = false;
let lastX = 0, momentum = 0;
let bubbleAmt = 0;         // 0..1 eased

function setHover(on){
  if (hovering === on) return;
  hovering = on;
  autoSpin = !on;
  hint.classList.toggle('dim', on);
}

el.addEventListener('pointerenter', ()=> setHover(true));
el.addEventListener('pointerleave', ()=> { if(!dragging) setHover(false); });

el.addEventListener('pointerdown', e=>{
  dragging = true; lastX = e.clientX; momentum = 0;
  setHover(true);
  el.classList.add('dragging');
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e=>{
  if (!dragging) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX;
  can.rotation.y += dx * 0.0075;
  momentum = dx * 0.0075;
});
function endDrag(e){
  if (!dragging) return;
  dragging = false;
  el.classList.remove('dragging');
  // if pointer is a touch, resume spin; mouse keeps hover state
  if (e && e.pointerType === 'touch') setHover(false);
}
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', endDrag);

/* ---------- loop ---------- */
const clock = new THREE.Clock();

function frame(){
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // rotation
  if (!dragging){
    if (Math.abs(momentum) > 0.0002){
      can.rotation.y += momentum;
      momentum *= 0.94;
    } else if (autoSpin){
      can.rotation.y += spinVel * (dt*60);
    }
  }

  // gentle float
  can.position.y = Math.sin(t*0.8)*0.035;

  // bubbles ease in on hover
  const target = hovering ? 1 : 0;
  bubbleAmt += (target - bubbleAmt) * Math.min(1, dt*4.5);

  if (bubbleAmt > 0.02){
    // higher spawn rate -> a denser, more obvious stream
    const rate = 78 * bubbleAmt;
    let budget = rate * dt;
    while (budget > 0){
      if (budget >= 1 || Math.random() < budget) spawn();
      budget -= 1;
    }
  }

  const topOut = H/2 + 1.6;
  let n = 0;
  for (const b of bData){
    if (!b.alive) continue;
    b.y += b.vy * dt;
    if (b.y > topOut){ b.alive = false; continue; }

    // quick fade in at birth, gentle fade out near the top
    b.fade = Math.min(1, b.fade + dt*5);
    const nearTop = Math.min(1, Math.max(0, (topOut - b.y) / 1.1));

    const sway = Math.sin(t*1.7 + b.ph) * 0.13;
    bPos[n*3]   = b.x + sway*b.drift;
    bPos[n*3+1] = b.y;
    bPos[n*3+2] = b.z + Math.cos(t*1.3 + b.ph)*0.09*b.drift;
    bSize[n]  = b.r;
    bAlpha[n] = b.fade * nearTop;
    n++;
  }
  bGeo.setDrawRange(0, n);
  bGeo.attributes.position.needsUpdate = true;
  bGeo.attributes.size.needsUpdate  = true;
  bGeo.attributes.alpha.needsUpdate = true;
  bMat.uniforms.uOpacity.value = 0.95 * bubbleAmt;   // far more visible

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

/* ---------- responsive ---------- */
function resize(){
  camera.aspect = innerWidth/innerHeight;
  // pull camera back on narrow screens so the can always fits
  const base = 13.2;
  const k = innerWidth < 620 ? Math.min(1.55, 620/Math.max(innerWidth,320)) : 1;
  camera.position.z = base * k;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  bMat.uniforms.uScale.value = innerHeight * 0.5;
}
addEventListener('resize', resize);
resize();

/* reduced motion */
if (matchMedia('(prefers-reduced-motion: reduce)').matches){
  spinVel = 0;
  autoSpin = false;
}
</script>
</body>
</html>
