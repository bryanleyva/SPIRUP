<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPIR UP · agua detras de la lata</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Banco de pruebas del agua. Usa EXACTAMENTE el mismo marcado, el mismo CSS
     y el mismo js/spirup-splash.js que la portada, asi que lo que calibres aqui
     se traslada tal cual a los data-splash-* de front-page.php.
     Para verlo limpio, sin controles, esta lata-agua.html. */
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:24px 16px 60px;
    font-family:'Montserrat',system-ui,sans-serif; color:#17343d;
    background:radial-gradient(120% 90% at 50% 20%, #eefaf9 0%, #d5eeed 55%, #c6e7e6 100%);
    display:flex; flex-direction:column; align-items:center;
  }
  h1{ font-family:'Manrope',sans-serif; font-weight:800; font-size:clamp(19px,2.6vw,30px); text-align:center; margin:0; }
  p.sub{ opacity:.62; font-size:13.5px; text-align:center; margin:6px 0 16px; max-width:64ch; }
  p.sub code{ background:rgba(23,52,61,.07); padding:1px 5px; border-radius:4px; }

  .lab{
    display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; justify-content:center;
    background:rgba(255,255,255,.7); border:1px solid rgba(23,52,61,.1);
    border-radius:18px; padding:12px 16px; margin-bottom:8px; max-width:880px;
  }
  .lab label{ font-family:'Manrope',sans-serif; font-weight:700; font-size:12.5px; color:#0c2f38;
    display:inline-flex; align-items:center; gap:7px; }
  .lab input[type=range]{ width:100px; accent-color:#37b6dd; }
  .lab output{ font-weight:600; font-variant-numeric:tabular-nums; min-width:42px; color:#3d6b73; }

  .replay{
    margin-top:14px; font-family:'Manrope',sans-serif; font-weight:700; font-size:15px;
    color:#0c2f38; background:#7fd6ec; border:0; border-radius:999px;
    padding:12px 30px; cursor:pointer; transition:transform .12s ease, background .15s ease;
  }
  .replay:hover{ background:#a5e4f4; transform:translateY(-1px); }
  .replay:active{ transform:scale(.97); }

  /* El escenario es el de la portada; solo se le da sitio en la pagina. */
  .spirup-parte2{ width:100%; }

  .snippet{
    margin-top:22px; width:min(92vw,880px);
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; line-height:1.6;
    background:#0e2b33; color:#cfeaf2; border-radius:12px; padding:14px 16px;
    overflow-x:auto; white-space:pre;
  }
  .snippet b{ color:#7fd6ec; font-weight:600; }
</style>
</head>
<body>

  <h1>SPIR UP · agua detras de la lata</h1>
  <p class="sub">
    Agua fotografica real (<code>imagenes/splash-agua.png</code>, extraida de <code>parte2-clean.png</code>
    y tenida de celeste). Brota con una mascara que crece desde la base de la lata y despues sigue
    ondulando. Calibra aqui y copia los valores a <code>front-page.php</code>.
  </p>

  <div class="lab">
    <label>Duracion <input type="range" id="duration" min="600" max="3000" step="50" value="1500"><output id="oDuration">1500</output></label>
    <label>Oleaje <input type="range" id="flow" min="0" max="3" step="0.05" value="1"><output id="oFlow">1.00</output></label>
    <label>Destellos <input type="range" id="shine" min="0" max="3" step="0.05" value="1"><output id="oShine">1.00</output></label>
    <label>Ancho <input type="range" id="spread" min="1.6" max="4.2" step="0.05" value="2.9"><output id="oSpread">2.90</output></label>
    <label>Alto <input type="range" id="y" min="0.30" max="0.90" step="0.01" value="0.60"><output id="oY">0.60</output></label>
    <label>Tono <input type="range" id="hue" min="-40" max="40" step="1" value="0"><output id="oHue">0</output></label>
    <label>Color <input type="range" id="sat" min="0.7" max="1.8" step="0.02" value="1.06"><output id="oSat">1.06</output></label>
  </div>

  <button class="replay" id="replay" type="button">Repetir efecto &#8635;</button>

  <!-- Mismo marcado que front-page.php -->
  <section class="spirup-parte2">
    <div class="spirup-parte2__stage" data-water-stage>
      <div class="spirup-parte2__water" aria-hidden="true" data-splash-manual
        data-splash-src="imagenes/splash-agua"
        data-splash-spread="2.9"
        data-splash-x="0.50"
        data-splash-y="0.60"
        data-splash-duration="1500"
        data-splash-flow="1"
        data-splash-shine="1"
        data-splash-filter="saturate(1.06)"></div>
      <img class="spirup-parte2__can" src="imagenes/lata-spir-up%201%20(2).png" alt="Lata Spir Up Citrus Blue">
    </div>
  </section>

  <div class="snippet" id="snippet"></div>

<script src="js/spirup-splash.js"></script>
<script>
(function(){
  'use strict';

  // El marcado lleva data-splash-manual, asi que el auto-montaje de
  // spirup-splash.js no toca este stage: se monta aqui para poder recalibrarlo
  // y repetirlo desde los controles.
  var stage  = document.querySelector('[data-water-stage]');
  var splash = window.SpirupSplash.create(stage, {
    mount: stage.querySelector('.spirup-parte2__water')
  });

  var ids = ['duration','flow','shine','spread','y','hue','sat'];
  var ctl = {}, out = {};
  ids.forEach(function(k){
    ctl[k] = document.getElementById(k);
    out[k] = document.getElementById('o' + k.charAt(0).toUpperCase() + k.slice(1));
  });
  var snippet = document.getElementById('snippet');

  // El PNG ya va tenido de celeste; esto es solo el retoque final
  function filterValue(){
    var f = 'saturate(' + (+ctl.sat.value).toFixed(2) + ')';
    if (+ctl.hue.value !== 0) { f += ' hue-rotate(' + ctl.hue.value + 'deg)'; }
    return f;
  }

  function apply(){
    out.duration.textContent = ctl.duration.value;
    out.hue.textContent      = ctl.hue.value;
    ['flow','shine','spread','y','sat'].forEach(function(k){
      out[k].textContent = (+ctl[k].value).toFixed(2);
    });

    splash.setConfig({
      duration: +ctl.duration.value,
      flow:     +ctl.flow.value,
      shine:    +ctl.shine.value,
      spread:   +ctl.spread.value,
      y:        +ctl.y.value,
      filter:   filterValue()
    });

    snippet.innerHTML =
      '&lt;div class="spirup-parte2__water" aria-hidden="true"\n' +
      '  data-splash-src="&lt;?php echo esc_url( $img . \'/splash-agua\' ); ?&gt;"\n' +
      '  <b>data-splash-spread</b>="'   + (+ctl.spread.value).toFixed(2) + '"\n' +
      '  data-splash-x="0.50"\n' +
      '  <b>data-splash-y</b>="'        + (+ctl.y.value).toFixed(2) + '"\n' +
      '  <b>data-splash-duration</b>="' + ctl.duration.value + '"\n' +
      '  <b>data-splash-flow</b>="'     + (+ctl.flow.value).toFixed(2) + '"\n' +
      '  <b>data-splash-shine</b>="'    + (+ctl.shine.value).toFixed(2) + '"\n' +
      '  <b>data-splash-filter</b>="'   + filterValue() + '"&gt;&lt;/div&gt;';
  }

  function replay(){ apply(); splash.play(true); }

  // oleaje, destellos y color se aprecian en vivo sobre el agua que ya fluye;
  // el resto necesita repetir la formacion para verse en contexto
  var live = { flow: 1, shine: 1, hue: 1, sat: 1 };
  ids.forEach(function(k){
    ctl[k].addEventListener('input', apply);
    if (!live[k]) { ctl[k].addEventListener('change', replay); }
  });
  document.getElementById('replay').addEventListener('click', replay);

  apply();
  setTimeout(replay, 200);
})();
</script>
</body>
</html>
