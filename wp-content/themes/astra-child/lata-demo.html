<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPIR UP · Lata + agua realista</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    min-height:100%;
    font-family:'Montserrat',system-ui,sans-serif;
    color:#17343d;
    background:radial-gradient(120% 90% at 50% 25%, #eaf6f3 0%, #cfeae6 55%, #bfe2df 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 16px; overflow:hidden;
  }
  h1{ font-family:'Manrope',sans-serif; font-weight:800; font-size:clamp(20px,3vw,32px); letter-spacing:-.01em; text-align:center; }
  p.sub{ opacity:.6; font-size:14px; text-align:center; margin:6px 0 18px; }

  .stage{
    position:relative;
    width:min(92vw,640px);
    aspect-ratio:1/1;
    display:grid; place-items:center;
  }

  /* AGUA REAL (PNG transparente). Detras de la lata. Se revela con .play */
  .splash{
    position:absolute; inset:0; margin:auto;
    width:100%; height:100%;
    object-fit:contain;
    z-index:1;
    opacity:0;
    transform:scale(.9);
    /* recorte circular que crece desde la lata hacia afuera */
    clip-path:circle(4% at 50% 54%);
    will-change:clip-path, transform, opacity;
  }
  .stage.play .splash{
    animation:splashIn 1.15s cubic-bezier(.18,.85,.22,1) forwards;
  }
  @keyframes splashIn{
    0%  { opacity:0; transform:scale(.86); clip-path:circle(4% at 50% 54%); }
    35% { opacity:1; }
    100%{ opacity:1; transform:scale(1);  clip-path:circle(85% at 50% 54%); }
  }

  /* LATA encima */
  .can{
    position:relative; z-index:2;
    width:clamp(150px,34%,240px); height:auto;
    filter:drop-shadow(6px 18px 22px rgba(9,52,60,.28));
    transform-origin:50% 62%;
  }
  .stage.play .can{ animation:canPop .7s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes canPop{ 0%{ transform:translateY(12px) scale(.97); } 100%{ transform:none; } }

  /* Aviso si falta el archivo del agua */
  .missing{
    position:absolute; z-index:3; inset:auto 0 8% 0; text-align:center;
    font-size:13px; color:#8a6d1f; background:#fff5d6; border:1px solid #ecd98a;
    padding:8px 14px; border-radius:10px; width:max-content; max-width:90%; margin:0 auto;
    display:none;
  }
  .missing.show{ display:block; }

  .replay{
    margin-top:24px; font-family:'Manrope',sans-serif; font-weight:700; font-size:15px;
    color:#0c2f38; background:#7fd6ec; border:0; border-radius:999px;
    padding:12px 30px; cursor:pointer; transition:transform .12s ease, background .15s ease;
  }
  .replay:hover{ background:#a5e4f4; transform:translateY(-1px); }
  .replay:active{ transform:scale(.97); }
</style>
</head>
<body>

  <h1>SPIR UP · el agua sale a los costados</h1>
  <p class="sub">El splash real (splash-agua.png) aparece y se queda quieto</p>

  <div class="stage" id="stage">
    <img class="splash" id="splash" src="imagenes/splash-agua.png" alt="" aria-hidden="true">
    <img class="can" id="can" src="imagenes/lata-spir-up%201%20(2).png" alt="Lata Spir Up Citrus Blue">
    <div class="missing" id="missing">
      Falta <b>imagenes/splash-agua.png</b> (PNG transparente del agua). Colócalo ahí y recarga.
    </div>
  </div>

  <button class="replay" id="replay" type="button">Repetir efecto ↺</button>

<script>
(function(){
  var stage=document.getElementById('stage');
  var splash=document.getElementById('splash');
  var missing=document.getElementById('missing');

  // Aviso si el PNG del agua aun no existe
  splash.addEventListener('error', function(){ missing.classList.add('show'); });

  function play(){
    stage.classList.remove('play');
    void stage.offsetWidth;      // reinicia la animacion
    stage.classList.add('play');
  }

  document.getElementById('replay').addEventListener('click', play);

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(play,200); });
  } else { setTimeout(play,200); }
})();
</script>
</body>
</html>
